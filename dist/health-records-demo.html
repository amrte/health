<!doctype html>
<html lang="en" data-demo-seed="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health Records (demo)</title>
  <meta name="description" content="Private, on-device tracker for lab results and other health records.">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%232a78d6%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M96%20276h82l38-92%2056%20176%2040-120%2022%2036h82%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E%0A">
  <style>
:root {
  color-scheme: light;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --on-accent: #ffffff;
  --series: #2a78d6;
  --band: rgba(12, 163, 12, 0.10);
  --good: #0ca30c;
  --critical: #d03b3b;
  --warn-ink: #8a5a00;
  --warn-bg: #fff6e0;
  --danger-ink: #b42f2f;
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --series: #3987e5;
    --band: rgba(12, 163, 12, 0.16);
    --warn-ink: #fab219;
    --warn-bg: #2a2310;
    --danger-ink: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-ink: #86b6ef;
  --series: #3987e5;
  --band: rgba(12, 163, 12, 0.16);
  --warn-ink: #fab219;
  --warn-bg: #2a2310;
  --danger-ink: #e66767;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font);
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
a { color: var(--accent-ink); }
h1, h2 { margin: 0; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; }
p { margin: 0 0 10px; }

#view { max-width: 760px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 24px; }
.page > * + * { margin-top: 14px; }
.pad { padding: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.warn { color: var(--warn-ink); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
.offscreen { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

/* header */
.page-head .back { display: inline-block; text-decoration: none; padding: 6px 0; font-size: 16px; }
.page-title-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin: 4px 0 0; }
.actions { display: flex; gap: 8px; }

/* cards & lists */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.card h2 { margin-bottom: 8px; }
.card.list { padding: 0; overflow: hidden; }
.group > h2, .group-head h2 { color: var(--ink-2); margin: 0 4px 8px; }
.group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.group-head h2 { margin: 0 4px; }
.row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  color: inherit;
  text-decoration: none;
  min-height: 56px;
}
.row + .row { border-top: 1px solid var(--grid); }
.row:active { background: var(--surface-2); }
@media (hover: hover) { .row:hover { background: var(--surface-2); } }
.row-main { min-width: 0; }
.row-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
.row-title.wrap { white-space: normal; }
.row-main > .status { display: block; margin-top: 2px; }
.row-meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.row .value { font-weight: 600; white-space: nowrap; }
.row > :only-child, .row-main:nth-last-child(2) { grid-column: 1 / 3; }

.status { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.status-icon { font-size: 11px; }
.st-high .status-icon, .st-low .status-icon { color: var(--critical); }
.st-normal .status-icon { color: var(--good); }
.st-none { color: var(--muted); }

.search {
  width: 100%;
  font: inherit;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  -webkit-appearance: none;
  appearance: none;
}

.empty { text-align: left; padding: 20px; }
.empty h2 { font-size: 18px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 15px; font-weight: 550;
  min-height: 40px; padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.danger { color: var(--danger-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.icon-btn {
  font: inherit; font-size: 22px; line-height: 1; width: 40px; height: 40px;
  border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 10px; flex: none;
}

/* hero */
.hero-label { color: var(--muted); font-size: 13px; }
.hero-value { font-size: 44px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 6px; }
.hero .status { font-size: 15px; }

/* chart */
.chart { position: relative; height: 220px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .band { fill: var(--band); }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .mk { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.chart .mk-out { fill: var(--critical); }
.chart .mk-active { stroke-width: 3; }
.chart .end-label { fill: var(--ink); font-size: 13px; font-weight: 600; }
.chart .crosshair { stroke: var(--axis); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart-empty { padding-top: 90px; text-align: center; }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 6px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); white-space: nowrap;
}
.tip-value { font-weight: 650; }
.tip-status { font-weight: 400; color: var(--ink-2); }
.tip-meta { color: var(--muted); font-size: 12px; }
.caption { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.spark { flex: none; }
.spark-line { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-linejoin: round; }
.spark-dot { fill: var(--series); }
.spark-dot.out { fill: var(--critical); }

/* tables */
.table-wrap { padding: 0; overflow-x: auto; }
table.results { width: 100%; border-collapse: collapse; font-size: 14px; }
.results th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 12px 6px; }
.results td { padding: 9px 12px; border-top: 1px solid var(--grid); vertical-align: top; }
.results td a { display: block; }
.results .value { font-weight: 600; font-variant-numeric: tabular-nums; }

/* photos */
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
.thumb-box { position: relative; }
.thumb {
  width: 84px; height: 84px; border-radius: 12px; overflow: hidden; padding: 0;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; font: inherit;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.add span { font-size: 28px; line-height: 1; }
.thumb-doc { font-weight: 700; font-size: 13px; }
.thumb-del {
  position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--bg); background: var(--ink-2); color: var(--surface); font-size: 16px; line-height: 1; cursor: pointer;
}
.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; color: #ccc; }
.viewer-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; }
.viewer-scroll img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; }
.viewer-scroll.zoomed { display: block; }
.viewer-scroll.zoomed img { max-width: none; max-height: none; width: 200%; }

/* forms */
.form { display: grid; gap: 12px; }
label > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
input[type="text"], input[type="date"], textarea, select {
  width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS zooming in */
  padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink);
}
input[type="date"] { min-height: 42px; -webkit-appearance: none; appearance: none; }
textarea { resize: vertical; }
.claude .steps { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.claude textarea { margin: 8px 0; }
.steps.plain { padding-left: 22px; margin: 0; }
.rows { display: grid; gap: 10px; }
.row-edit { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.row-edit.unknown { border-color: var(--warn-ink); }
.row-edit-head { display: flex; gap: 6px; align-items: center; }
.row-edit-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
.row-edit-grid.two { grid-template-columns: 1.6fr 1fr; }
.row-edit input { padding: 7px 9px; }
.preview { font-size: 13px; color: var(--ink-2); }
.preview.warn { color: var(--warn-ink); background: var(--warn-bg); padding: 6px 8px; border-radius: 8px; }
.save-bar {
  position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 3;
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 10px 0;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.note { white-space: pre-wrap; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs a {
  flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 8px 0 7px; font-size: 11px; color: var(--muted); text-decoration: none;
}
.tabs a span { font-size: 20px; line-height: 1.1; }
.tabs a[aria-current] { color: var(--accent-ink); font-weight: 600; }

#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  max-width: calc(100% - 32px); pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .row { gap: 10px; padding: 10px 14px; }
  .spark { width: 44px; }
  .row-edit-grid { grid-template-columns: 1fr 1fr; }
  .row-edit-grid .f-refRaw { grid-column: 1 / -1; }
  .row-edit-grid.two { grid-template-columns: 1fr; }
}

/* vaccinations */
.st-soon .status-icon { color: #fab219; }
.kv { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; padding: 7px 0; }
.kv + .kv { border-top: 1px solid var(--grid); }
.kv > span { color: var(--muted); font-size: 14px; }
.label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.grow { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font: inherit; font-size: 14px; padding: 5px 10px; min-height: 32px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); cursor: pointer;
}
.chip.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: transparent; }
select.chip-add { width: auto; font-size: 14px; padding: 5px 10px; border-radius: 999px; min-height: 32px; }
@media (max-width: 420px) { .kv { grid-template-columns: 1fr; gap: 2px; } }

/* findings & knowledge */
.findings { display: grid; gap: 0; }
.findings > h2 { margin-bottom: 4px; }
.finding { padding: 10px 0; }
.finding + .finding { border-top: 1px solid var(--grid); }
.finding-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.finding-icon { font-size: 12px; }
.lv-alert .finding-icon { color: var(--critical); }
.lv-attention .finding-icon { color: #fab219; }
.lv-info .finding-icon { color: var(--accent); }
.lv-good .finding-icon { color: var(--good); }
.finding-title { display: block; font-weight: 600; margin: 2px 0; color: var(--ink); }
a.finding-title { color: var(--accent-ink); text-decoration: none; }
.finding-text { margin: 0; color: var(--ink-2); font-size: 15px; }
.finding-src { font-size: 13px; color: var(--muted); margin-top: 4px; }
.findings .btn { margin-top: 8px; justify-self: start; }
.hint-card { display: block; color: var(--ink-2); text-decoration: none; font-size: 15px; }
.hint-card strong { color: var(--accent-ink); }
.about h3 { font-size: 14px; margin: 14px 0 6px; color: var(--ink-2); }
.about p { color: var(--ink-2); }
.about strong { color: var(--ink); }
table.limits { width: 100%; border-collapse: collapse; font-size: 14px; }
.limits td { padding: 6px 8px 6px 0; border-top: 1px solid var(--grid); vertical-align: top; }
.limits .limit-value { width: 45%; font-weight: 550; }
.about { overflow-wrap: anywhere; }
ul.sources { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }

/* discuss with Claude */
.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.pick fieldset { border: 0; padding: 0; margin: 12px 0 0; }
.pick legend { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0; }
.summary-preview { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--ink-2); max-height: 420px; overflow: auto; }

/* vaccination schedules */
.advice { padding: 12px 16px; }
.advice + .advice { border-top: 1px solid var(--grid); }
.row .advice { padding: 0; }
.advice-line { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 8px; margin-top: 4px; align-items: baseline; }
.advice-country { font-size: 13px; color: var(--muted); }
.advice-text { grid-column: 2; font-size: 14px; color: var(--ink-2); }
.notes ul { margin: 0 0 8px; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }

/* fitness */
.chart .bar { fill: var(--series); }
.chart .bar-met { fill: var(--series); }
.chart .target { stroke: var(--ink-2); stroke-width: 1; }
.chart .target-label { fill: var(--ink-2); font-size: 11px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; color: inherit; text-decoration: none; display: block; }
.tile-label { font-size: 13px; color: var(--muted); }
.tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin: 2px 0; }
.tile-value small { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-delta { font-size: 13px; color: var(--ink-2); }
.tile .spark { width: 100%; height: 28px; margin-top: 4px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chart-card h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-card h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
