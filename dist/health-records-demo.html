  <style>
:root {
  color-scheme: light;
  --bg: #f6f5ee;
  --bg-tint: #e9f1e1;
  --surface: #fffefa;
  --surface-2: #edf1e6;
  --ink: #1d2a21;
  --ink-2: #46544a;
  --muted: #637165;
  --grid: #e4e8dc;
  --axis: #c3cbb8;
  --border: rgba(29, 42, 33, 0.10);
  --shadow: 0 1px 2px rgba(29, 42, 33, 0.04), 0 6px 18px rgba(29, 42, 33, 0.05);
  --accent: #3c7a4c;
  --accent-ink: #2c6a3d;
  --accent-soft: #dfeccf;
  --on-accent: #ffffff;
  --series: #3c7a4c;
  --band: rgba(196, 160, 92, 0.16);
  --good: #2f8f3e;
  --critical: #c0453a;
  --warn: #d49a12;
  --info: #3a8597;
  --warn-ink: #8a5a00;
  --warn-bg: #fbf3df;
  --danger-ink: #a83a30;
  --leaf: #8db87a;
  --leaf-2: #b9d4a6;
  --stem: #6f9a5e;
  --radius: 16px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1410;
    --bg-tint: #13201a;
    --surface: #161f19;
    --surface-2: #1f2b23;
    --ink: #e8eee5;
    --ink-2: #bfcabd;
    --muted: #8d9a8e;
    --grid: #253129;
    --axis: #344238;
    --border: rgba(232, 238, 229, 0.09);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    --accent: #6dbb7c;
    --accent-ink: #93d29f;
    --accent-soft: #23382a;
    --on-accent: #0e1410;
    --series: #6dbb7c;
    --band: rgba(196, 160, 92, 0.14);
    --good: #5cc46b;
    --critical: #e0675c;
    --warn: #e3a72f;
    --info: #6fb3c4;
    --warn-ink: #e3a72f;
    --warn-bg: #2a2412;
    --danger-ink: #e98278;
    --leaf: #3f6b45;
    --leaf-2: #2f5236;
    --stem: #4e7d55;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1410;
  --bg-tint: #13201a;
  --surface: #161f19;
  --surface-2: #1f2b23;
  --ink: #e8eee5;
  --ink-2: #bfcabd;
  --muted: #8d9a8e;
  --grid: #253129;
  --axis: #344238;
  --border: rgba(232, 238, 229, 0.09);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  --accent: #6dbb7c;
  --accent-ink: #93d29f;
  --accent-soft: #23382a;
  --on-accent: #0e1410;
  --series: #6dbb7c;
  --band: rgba(196, 160, 92, 0.14);
  --good: #5cc46b;
  --critical: #e0675c;
  --warn: #e3a72f;
  --info: #6fb3c4;
  --warn-ink: #e3a72f;
  --warn-bg: #2a2412;
  --danger-ink: #e98278;
  --leaf: #3f6b45;
  --leaf-2: #2f5236;
  --stem: #4e7d55;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font);
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
a { color: var(--accent-ink); }
h1, h2 { margin: 0; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; }
p { margin: 0 0 10px; }

#view { max-width: 760px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 24px; }
.page > * + * { margin-top: 14px; }
.pad { padding: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.warn { color: var(--warn-ink); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
.offscreen { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

/* header */
.page-head .back { display: inline-block; text-decoration: none; padding: 6px 0; font-size: 16px; }
.page-title-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin: 4px 0 0; }
.actions { display: flex; gap: 8px; }

/* cards & lists */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.card h2 { margin-bottom: 8px; }
.card.list { padding: 0; overflow: hidden; }
.group > h2, .group-head h2 { color: var(--ink-2); margin: 0 4px 8px; }
.group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.group-head h2 { margin: 0 4px; }
.row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  color: inherit;
  text-decoration: none;
  min-height: 56px;
}
.row + .row { border-top: 1px solid var(--grid); }
.row:active { background: var(--surface-2); }
@media (hover: hover) { .row:hover { background: var(--surface-2); } }
.row-main { min-width: 0; }
.row-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
.row-title.wrap { white-space: normal; }
.row-main > .status { display: block; margin-top: 2px; }
.row-meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.row .value { font-weight: 600; white-space: nowrap; }
.row > :only-child, .row-main:nth-last-child(2) { grid-column: 1 / 3; }

.status { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.status-icon { font-size: 11px; }
.st-high .status-icon, .st-low .status-icon { color: var(--critical); }
.st-normal .status-icon { color: var(--good); }
.st-none { color: var(--muted); }

.search {
  width: 100%;
  font: inherit;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  -webkit-appearance: none;
  appearance: none;
}

.empty { text-align: left; padding: 20px; }
.empty h2 { font-size: 18px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 15px; font-weight: 550;
  min-height: 40px; padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.danger { color: var(--danger-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.icon-btn {
  font: inherit; font-size: 22px; line-height: 1; width: 40px; height: 40px;
  border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 10px; flex: none;
}

/* hero */
.hero-label { color: var(--muted); font-size: 13px; }
.hero-value { font-size: 44px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 6px; }
.hero .status { font-size: 15px; }

/* chart */
.chart { position: relative; height: 220px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .band { fill: var(--band); }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .mk { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.chart .mk-out { fill: var(--critical); }
.chart .mk-active { stroke-width: 3; }
.chart .end-label { fill: var(--ink); font-size: 13px; font-weight: 600; }
.chart .crosshair { stroke: var(--axis); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart-empty { padding-top: 90px; text-align: center; }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 6px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); white-space: nowrap;
}
.tip-value { font-weight: 650; }
.tip-status { font-weight: 400; color: var(--ink-2); }
.tip-meta { color: var(--muted); font-size: 12px; }
.caption { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.spark { flex: none; }
.spark-line { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-linejoin: round; }
.spark-dot { fill: var(--series); }
.spark-dot.out { fill: var(--critical); }

/* tables */
.table-wrap { padding: 0; overflow-x: auto; }
table.results { width: 100%; border-collapse: collapse; font-size: 14px; }
.results th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 12px 6px; }
.results td { padding: 9px 12px; border-top: 1px solid var(--grid); vertical-align: top; }
.results td a { display: block; }
.results .value { font-weight: 600; font-variant-numeric: tabular-nums; }

/* photos */
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
.thumb-box { position: relative; }
.thumb {
  width: 84px; height: 84px; border-radius: 12px; overflow: hidden; padding: 0;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; font: inherit;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.add span { font-size: 28px; line-height: 1; }
.thumb-doc { font-weight: 700; font-size: 13px; }
.thumb-del {
  position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--bg); background: var(--ink-2); color: var(--surface); font-size: 16px; line-height: 1; cursor: pointer;
}
.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; color: #ccc; }
.viewer-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; }
.viewer-scroll img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; }
.viewer-scroll.zoomed { display: block; }
.viewer-scroll.zoomed img { max-width: none; max-height: none; width: 200%; }

/* forms */
.form { display: grid; gap: 12px; }
label > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
input[type="text"], input[type="date"], textarea, select {
  width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS zooming in */
  padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink);
}
input[type="date"] { min-height: 42px; -webkit-appearance: none; appearance: none; }
textarea { resize: vertical; }
.claude .steps { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.claude textarea { margin: 8px 0; }
.steps.plain { padding-left: 22px; margin: 0; }
.rows { display: grid; gap: 10px; }
.row-edit { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.row-edit.unknown { border-color: var(--warn-ink); }
.row-edit-head { display: flex; gap: 6px; align-items: center; }
.row-edit-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
.row-edit-grid.two { grid-template-columns: 1.6fr 1fr; }
.row-edit input { padding: 7px 9px; }
.preview { font-size: 13px; color: var(--ink-2); }
.preview.warn { color: var(--warn-ink); background: var(--warn-bg); padding: 6px 8px; border-radius: 8px; }
.save-bar {
  position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 3;
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 10px 0;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.note { white-space: pre-wrap; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs a {
  flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 8px 0 7px; font-size: 11px; color: var(--muted); text-decoration: none;
}
.tabs a span { font-size: 20px; line-height: 1.1; }
.tabs a[aria-current] { color: var(--accent-ink); font-weight: 600; }

#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  max-width: calc(100% - 32px); pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .row { gap: 10px; padding: 10px 14px; }
  .spark { width: 44px; }
  .row-edit-grid { grid-template-columns: 1fr 1fr; }
  .row-edit-grid .f-refRaw { grid-column: 1 / -1; }
  .row-edit-grid.two { grid-template-columns: 1fr; }
}

/* vaccinations */
.st-soon .status-icon { color: var(--warn); }
.kv { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; padding: 7px 0; }
.kv + .kv { border-top: 1px solid var(--grid); }
.kv > span { color: var(--muted); font-size: 14px; }
.label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.grow { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font: inherit; font-size: 14px; padding: 5px 10px; min-height: 32px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); cursor: pointer;
}
.chip.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: transparent; }
select.chip-add { width: auto; font-size: 14px; padding: 5px 10px; border-radius: 999px; min-height: 32px; }
@media (max-width: 420px) { .kv { grid-template-columns: 1fr; gap: 2px; } }

/* findings & knowledge */
.findings { display: grid; gap: 0; }
.findings > h2 { margin-bottom: 4px; }
.finding { padding: 10px 0; }
.finding + .finding { border-top: 1px solid var(--grid); }
.finding-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.finding-icon { font-size: 12px; }
.lv-alert .finding-icon { color: var(--critical); }
.lv-attention .finding-icon { color: var(--warn); }
.lv-info .finding-icon { color: var(--info); }
.lv-good .finding-icon { color: var(--good); }
.finding-title { display: block; font-weight: 600; margin: 2px 0; color: var(--ink); }
a.finding-title { color: var(--accent-ink); text-decoration: none; }
.finding-text { margin: 0; color: var(--ink-2); font-size: 15px; }
.finding-src { font-size: 13px; color: var(--muted); margin-top: 4px; }
.findings .btn { margin-top: 8px; justify-self: start; }
.hint-card { display: block; color: var(--ink-2); text-decoration: none; font-size: 15px; }
.hint-card strong { color: var(--accent-ink); }
.about h3 { font-size: 14px; margin: 14px 0 6px; color: var(--ink-2); }
.about p { color: var(--ink-2); }
.about strong { color: var(--ink); }
table.limits { width: 100%; border-collapse: collapse; font-size: 14px; }
.limits td { padding: 6px 8px 6px 0; border-top: 1px solid var(--grid); vertical-align: top; }
.limits .limit-value { width: 45%; font-weight: 550; }
.about { overflow-wrap: anywhere; }
ul.sources { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }

/* discuss with Claude */
.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.pick fieldset { border: 0; padding: 0; margin: 12px 0 0; }
.pick legend { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0; }
.summary-preview { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--ink-2); max-height: 420px; overflow: auto; }

/* vaccination schedules */
.advice { padding: 12px 16px; }
.advice + .advice { border-top: 1px solid var(--grid); }
.row .advice { padding: 0; }
.advice-line { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 8px; margin-top: 4px; align-items: baseline; }
.advice-country { font-size: 13px; color: var(--muted); }
.advice-text { grid-column: 2; font-size: 14px; color: var(--ink-2); }
.notes ul { margin: 0 0 8px; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }

/* fitness */
.chart .bar { fill: var(--series); }
.chart .bar-met { fill: var(--series); }
.chart .target { stroke: var(--ink-2); stroke-width: 1; }
.chart .target-label { fill: var(--ink-2); font-size: 11px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; color: inherit; text-decoration: none; display: block; }
.tile-label { font-size: 13px; color: var(--muted); }
.tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin: 2px 0; }
.tile-value small { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-delta { font-size: 13px; color: var(--ink-2); }
.tile .spark { width: 100%; height: 28px; margin-top: 4px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chart-card h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-card h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }

/* blood pressure */
.chart .bp-bar { stroke: var(--series); stroke-width: 2; stroke-linecap: round; }
.chart .bp-dot { fill: var(--series); stroke: var(--surface); stroke-width: 1.5; }
.chart .bp-bar.out { stroke: var(--critical); }
.chart .bp-dot.out { fill: var(--critical); }
.bp-form { display: grid; gap: 12px; }
.bp-nums { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.bp-nums input { font-size: 28px; font-weight: 650; text-align: center; padding: 10px 6px; }
.bp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bp-latest { font-size: 32px; font-weight: 650; letter-spacing: -0.01em; }

/* DNA */
.note-card { font-size: 14px; color: var(--ink-2); background: var(--warn-bg); }
.dna-calls { font-size: 13px; margin-top: 6px; display: grid; gap: 2px; overflow-wrap: anywhere; }
.lv-none .finding-icon { color: var(--muted); }

/* ---- layout helpers (all sizes) ---- */
.tabs .brand, .tabs .quick { display: none; }
.split, .stack { display: grid; gap: 14px; align-content: start; }
.split > *, .stack > * { margin: 0; min-width: 0; }
.chart-grid { display: grid; gap: 14px; }
.overview-grid > * + * { margin-top: 14px; }

/* ---- wide screens (MacBook and other laptops/desktops) ---- */
@media (min-width: 960px) {
  body { padding-bottom: 0; padding-left: 240px; }
  .tabs {
    top: 0; bottom: 0; right: auto; width: 240px;
    flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 2px;
    padding: 20px 14px; border-top: 0; border-right: 1px solid var(--border);
    background: var(--surface);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .tabs .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; padding: 4px 10px 22px; color: var(--ink); }
  .tabs .brand img { border-radius: 7px; }
  .tabs a { flex: none; max-width: none; flex-direction: row; align-items: center; gap: 12px; font-size: 15px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); }
  .tabs a span { font-size: 17px; width: 22px; text-align: center; }
  .tabs a[aria-current] { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent-ink); }
  .tabs a:not(.btn):hover { background: var(--surface-2); }
  .tabs .quick { display: grid; gap: 8px; margin-top: auto; padding: 16px 0 4px; }
  .tabs .quick .btn { justify-content: center; font-size: 14px; padding: 8px 10px; }
  .tabs .quick .btn.primary { color: var(--on-accent); }

  #view { max-width: 1200px; padding: 36px 48px 56px; }
  h1 { font-size: 30px; }
  .page > * + * { margin-top: 18px; }
  .search { max-width: 520px; }

  /* Overview: categories flow in two columns, summary sections span both. */
  .overview-grid { columns: 2; column-gap: 20px; }
  .overview-grid > * { break-inside: avoid; margin: 0 0 20px; }
  .overview-grid > * + * { margin-top: 0; }
  .overview-grid > .wide { column-span: all; }
  .overview-grid > .hint-card { display: block; }

  .split { grid-template-columns: minmax(300px, 2fr) 3fr; gap: 20px; align-items: start; }
  .discuss-split { grid-template-columns: minmax(340px, 1fr) 1.2fr; }
  .sticky { position: sticky; top: 24px; }
  .discuss-split .summary-preview { max-height: calc(100vh - 140px); }
  .chart-grid { grid-template-columns: 1fr 1fr; gap: 18px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .rows { grid-template-columns: 1fr 1fr; }
  .thumb { width: 110px; height: 110px; }
  .save-bar { bottom: 0; }
  #toast { left: calc(50% + 120px); bottom: 28px; }
  .row { padding: 12px 18px; }
  .card { padding: 16px 20px; }
  .card.list, .table-wrap { padding: 0; }
  .viewer { left: 0; }
  .viewer-scroll.zoomed img { width: 140%; }
}
@media (min-width: 1400px) {
  .overview-grid { columns: 3; }
}

.memory-banner { background: var(--warn-bg); color: var(--ink); border-bottom: 1px solid var(--border); padding: 10px 16px; font-size: 14px; text-align: center; }

/* search */
.tabs .side-search-wrap { display: none; }
.search-big { font-size: 18px; padding: 12px 16px; }
.search-results > * + * { margin-top: 14px; }
.search-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
@media (min-width: 960px) {
  .tabs .side-search-wrap { display: block; position: relative; margin: 0 0 14px; }
  .tabs .side-search { width: 100%; font: inherit; font-size: 14px; padding: 8px 44px 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); }
  .tabs .side-search-wrap kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px var(--font); color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; pointer-events: none; }
  .search-big { display: none; } /* the sidebar box is the search field on wide screens */
  .search-results { columns: 2; column-gap: 20px; }
  .search-results > * { break-inside: avoid; margin: 0 0 20px; }
  .search-results > * + * { margin-top: 0; }
}

/* navigation: some sections only in the wide sidebar, "More" only on phones */
.tabs .desk-only { display: none; }
@media (min-width: 960px) {
  .tabs .desk-only { display: flex; }
  .tabs .mobile-only { display: none; }
}

/* teeth */
.tooth-chart { display: grid; gap: 6px; }
.arch { display: grid; gap: 8px; }
.half-label { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.half-teeth { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.arch + .arch { margin-top: 6px; }
.arch + .arch .half { display: flex; flex-direction: column-reverse; }
.arch + .arch .half-label { margin: 3px 0 0; }
.tooth {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 48px; border-radius: 10px 10px 14px 14px; border: 1px solid var(--axis);
  background: var(--surface); color: var(--ink); text-decoration: none; font-variant-numeric: tabular-nums;
}
.arch + .arch .tooth { border-radius: 14px 14px 10px 10px; }
.tooth-num { font-size: 12px; color: var(--muted); }
.tooth-badges { font-size: 12px; font-weight: 650; min-height: 15px; color: var(--accent-ink); }
.tooth.treated { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--axis)); }
.tooth.missing { background: transparent; border-style: dashed; }
.tooth.missing .tooth-badges { color: var(--muted); }
.tooth:hover { border-color: var(--accent); }
.tooth:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.xray-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.xray { margin: 0; }
.xray .thumb { width: 100%; height: auto; aspect-ratio: 16 / 10; }
.xray figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.file-edit { grid-template-columns: 96px 1fr; }
.file-edit .thumb { width: 96px; height: 96px; }
@media (min-width: 960px) {
  .arch { grid-template-columns: 1fr 1fr; gap: 12px; }
  .arch .half:last-child .half-label { text-align: right; }
  .tooth { min-height: 58px; }
}
.more-list .row-title { font-size: 17px; }

.type-badge { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); vertical-align: 2px; }
.row-main > .row-meta + .row-meta { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.doc h3 { font-size: 14px; color: var(--ink-2); margin: 14px 0 4px; }
.doc-list { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.doc-quote { font-style: italic; color: var(--ink-2); border-left: 3px solid var(--grid); padding-left: 10px; }

.doc-fields { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; }
.doc-fields > summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.doc-fields[open] { display: grid; gap: 12px; }
.doc-fields[open] > summary { margin-bottom: 2px; }

/* ---- nature theme ---- */
body {
  background:
    radial-gradient(900px 360px at 85% -120px, var(--bg-tint), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
h1, h2, .hero-value, .tile-value, .bp-latest, .brand { font-family: var(--font-head); }
h1 { font-weight: 700; letter-spacing: -0.015em; }
.card, .tile, .row-edit {
  border-color: var(--border);
  box-shadow: var(--shadow);
}
.card.list .row + .row, .row + .row { border-top-color: var(--grid); }
.group > h2, .group-head h2 { color: var(--accent-ink); font-size: 14px; letter-spacing: 0.01em; }
.btn { border-radius: 12px; transition: background-color .15s, border-color .15s, box-shadow .15s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.btn.primary { background: var(--accent); box-shadow: 0 1px 2px rgba(29, 42, 33, .12); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.search { border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.search:focus, input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip.on { background: var(--accent-soft); }
mark { background: var(--accent-soft); }
.status-icon { font-size: 11px; }
.row:active, .row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.tabs a[aria-current] { color: var(--accent-ink); }
.type-badge { background: var(--accent-soft); color: var(--accent-ink); }
.tooth.treated { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--axis)); }
.chart .tick { fill: var(--muted); }
.tip { border-radius: 12px; box-shadow: var(--shadow); }
.note-card { background: var(--warn-bg); }

/* Overview banner with a leaf sprig */
.hero-banner {
  position: relative; overflow: hidden;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 22px 20px 20px; border-radius: 22px;
  background: linear-gradient(135deg, var(--bg-tint) 0%, color-mix(in srgb, var(--bg-tint) 40%, var(--surface)) 60%, var(--surface) 100%);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.hero-banner .hero-text { position: relative; z-index: 1; max-width: 640px; }
.hero-banner .actions { position: relative; z-index: 1; }
.hero-greeting { color: var(--accent-ink); font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.hero-banner .sub { color: var(--ink-2); margin: 6px 0 0; }
.leaf-sprig { position: absolute; right: -18px; top: -14px; width: 190px; height: 133px; opacity: .9; pointer-events: none; transform: rotate(8deg); }
.leaf-empty { display: block; width: 120px; height: 84px; margin: 0 0 6px -6px; }
.side-leaves { display: none; }
@media (max-width: 480px) {
  .hero-banner { padding: 18px 16px 16px; border-radius: 18px; }
  .leaf-sprig { width: 130px; height: 91px; right: -22px; top: -16px; opacity: .75; }
  .hero-banner .actions { width: 100%; }
}
@media (min-width: 960px) {
  .tabs { background: color-mix(in srgb, var(--surface) 80%, var(--bg-tint)); }
  .tabs a[aria-current] { background: var(--accent-soft); }
  .side-leaves { display: block; width: 150px; height: 105px; margin: auto 0 -6px 30px; opacity: .85; pointer-events: none; }
  .tabs .quick { margin-top: 0; }
  .hero-banner { padding: 28px 28px 24px; }
  .leaf-sprig { width: 260px; height: 182px; right: -10px; top: -26px; }
  .hero-banner .actions { margin-right: 200px; }
}
@media (prefers-reduced-transparency: reduce) { .tabs { -webkit-backdrop-filter: none; backdrop-filter: none; } }
.tooth.missing, .tooth.missing.treated { background: transparent; border-style: dashed; border-color: var(--axis); }
